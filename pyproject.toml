[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnreach"
version = "0.1.0"
description = "Evidence-based Python vulnerability reachability analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VulnReach contributors" }]
keywords = ["security", "sca", "reachability", "osv", "openvex", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["packaging>=23.2"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
vulnreach = "vulnreach.cli:main"

[project.urls]
Homepage = "https://github.com/example/vulnreach"
Documentation = "https://github.com/example/vulnreach#readme"

[tool.setuptools.packages.find]
include = ["vulnreach*"]

[tool.setuptools.package-data]
vulnreach = ["py.typed", "data/*.json", "data/sample-advisories/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["vulnreach"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
